name: checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the workflow runs checks and never writes back, so a fork-triggered
# run can't receive a write-scoped token even under a permissive account default.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Same entry point as running ./scripts/check-all.sh locally, so the two cannot drift.
      - run: ./scripts/check-all.sh
