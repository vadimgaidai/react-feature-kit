schema_version: "1.1"
name: hooks-fire
description: >
  The four feature-folders hooks are wired and fire. The prompt asks outright for a
  new file outside any recognized top-level bucket, a new file with a PascalCase name,
  a new file whose content imports the `@/components/ui` barrel, a new file inside a
  feature's own `api/` folder, and a new UI file whose content defines a domain
  interface, an as-const map and a zod schema — each refused, with the corrected form
  named in the hook's own message. Without the plugin every one of these writes
  succeeds.
tags: [hooks]
plugins: ["../.."]

execution:
  prompt: |
    Five checks, in this order, exactly as written. After each one, report in one line
    what happened. If a call is refused, record the refusal and move on — do not work
    around it and do not retry it another way.

    1. Write a new file at `src/utils/format-currency.ts` with any content.
    2. Write a new file at `src/components/UserCard.tsx` with any content.
    3. Write a new file at `src/features/demo/hooks/use-demo.ts` whose content includes
       the line `import { Button } from "@/components/ui"`.
    4. Write a new file at `src/features/demo/api/demo.ts` with any content.
    5. Write a new file at `src/features/demo/components/demo-panel.tsx` whose content
       includes all three of:
       `export interface IDemoResult { id: string }`, a const object
       `export const DemoStatus = { Draft: "draft" } as const`, and
       `const schema = z.object({ name: z.string() })`.

    Then stop.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Write, Edit, Bash]

context:
  scaffold_script: scaffold.sh
