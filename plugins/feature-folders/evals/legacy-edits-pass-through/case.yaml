schema_version: "1.1"
name: legacy-edits-pass-through
description: >
  The core claim that separates this plugin from feature-sliced-design: editing a file
  that already exists never trips the placement or naming hooks, however it is named or
  where it lives. The fixture is a legacy project that predates the plugin — a dumping-
  ground `utils/` folder, a `helpers/` folder, and a PascalCase component — and the
  prompt makes a small real edit to each one. Neither hook may fire once across all three.
tags: [hooks, legacy]
plugins: ["../.."]

execution:
  prompt: |
    Three small fixes, in this order. After each one, report in one line what changed.

    1. `src/utils/format-date.ts` has a bug: it doesn't guard against an invalid date
       string. Add a guard that returns an empty string instead of throwing.
    2. `src/helpers/slugify.ts` leaves a trailing hyphen when the input ends in a
       non-alphanumeric character. Fix it so the output never ends in a hyphen.
    3. `src/components/OldWidget.tsx` renders the literal text "Wlecome" — fix the typo.

    Then stop. Don't rename or move any of these files.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Edit, Bash]

context:
  scaffold_script: scaffold.sh
