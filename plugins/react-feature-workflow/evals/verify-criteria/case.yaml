schema_version: "1.1"
name: verify-criteria
description: >
  `/verify` answers every acceptance criterion in the spec with a verdict and an evidence
  tier: the order criterion from the test command it ran, the disabled submit from a
  `file:line`, the missing 409 branch as a fail, and the offline retry as unverifiable with
  manual steps. It also catches the field the types carry and the contract never lists,
  edits nothing, and writes `VERIFY.md`.
tags: [verify, planning]
plugins: ["../.."]

execution:
  prompt: |
    Verify the changes on this branch against the spec: /react-feature-workflow:verify
  max_turns: 30
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Bash, Write, Skill]

context:
  scaffold_script: scaffold.sh
