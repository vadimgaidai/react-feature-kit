schema_version: "1.1"
name: spec-change
description: >
  A request that edits a module which already exists gets the `change` shape: a delta spec
  with an `## Unchanged behaviour` section naming what must keep working, acceptance
  criteria citing their rules, and assumptions for what the request left unsaid.
tags: [spec, planning]
plugins: ["../.."]

execution:
  prompt: |
    /react-feature-workflow:spec change: the comment list should paginate — 20 per page,
    with a load-more control at the bottom.

    Answers to anything you would otherwise ask: the name is `comment-pagination`; the
    existing endpoint takes `page` and `perPage` query parameters; the list must keep
    rendering oldest first as it does today. Do not ask questions — record what is left
    as assumptions.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write, Skill]

context:
  scaffold_script: scaffold.sh
