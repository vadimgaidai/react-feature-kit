schema_version: "1.1"
name: contract-outranks-plan
description: >
  The central claim in docs/DESIGN.md — the sliced contract is authoritative and the
  raw spec is never re-read. The plan's prose asks for a field the contract does not
  define; the contract must win, and the deviation must be reported.
tags: [implement, contract]
plugins: ["../.."]

execution:
  prompt: |
    Use the `implement` skill to build the feature planned in `.planning/comments/PLAN.md`.
    Everything you need is in that folder. Work through it in one pass — do not ask me
    questions, decide and report what you decided.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill]

context:
  scaffold_script: scaffold.sh
