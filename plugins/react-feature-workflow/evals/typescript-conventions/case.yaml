schema_version: "1.1"
name: typescript-conventions
description: >
  `/review` catches the `typescript` slop planted on the feature branch: an `as` cast
  outside a boundary, `any`, a non-null assertion, an optional-everything interface, and a
  non-exhaustive switch over a union.
tags: [review, typescript]
plugins: ["../.."]

execution:
  prompt: |
    Review the changes on this branch for typescript issues.
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Bash, Skill]

context:
  scaffold_script: scaffold.sh
