schema_version: "1.1"
name: review-skill-conformance
description: >
  `/review`'s `skills` angle catches five planted convention violations by reading each
  governing skill's `## Reviewing` / `## Never` section and quoting its sentence against the
  offending line: a redundant effect, a hand-written query key, a `dark:` override, a
  `space-y-*` in a wrapping flex, and a schema inline in a component — never reads the
  comparison module whole, edits nothing, and writes the report to `REVIEW.md`.
tags: [review, skills]
plugins: ["../.."]

execution:
  prompt: |
    Review the changes on this branch for skills conformance: /review skills
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write, Skill]

context:
  scaffold_script: scaffold.sh
