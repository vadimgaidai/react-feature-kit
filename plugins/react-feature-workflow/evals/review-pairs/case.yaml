schema_version: "1.1"
name: review-pairs
description: >
  `/review` finds four planted defects and leaves their legitimate twins alone: a sort on
  props in place (twin: a local copy), a compound part holding its own copy of `Root`'s
  state (twin: read from context), a form `reset` on every refetch (twin: reset on entity
  change, `keepDirtyValues` otherwise), an infinite query on the plain list key (twin: its
  own `infinite(filters)` entry). Each defect is reported at its `file:line`; no twin is.
tags: [review, pairs]
plugins: ["../.."]

execution:
  prompt: |
    Review the changes on this branch: /review
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Skill]

context:
  scaffold_script: scaffold.sh
