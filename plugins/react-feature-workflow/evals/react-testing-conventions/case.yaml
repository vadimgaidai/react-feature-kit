schema_version: "1.1"
name: react-testing-conventions
description: >
  `/review` catches the `react-testing` slop planted on the feature branch: a test that
  mocks the component under test instead of only the network boundary, and an arbitrary
  `setTimeout` used to wait for async UI instead of a testing-library query.
tags: [review, react-testing]
plugins: ["../.."]

execution:
  prompt: |
    Review the changes on this branch for react-testing issues.
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Bash, Skill]

context:
  scaffold_script: scaffold.sh
