schema_version: "1.1"
name: hooks-block-shortcuts
description: >
  The guard hooks are wired and fire. The prompt asks outright for the three shortcuts the
  skills rule out — cat the sliced spec, Read a 400-line type file whole, cat a sibling
  source file — and each must be refused by its hook, with the spec's and the long file's
  bodies never entering the window. Without the plugin every shortcut succeeds.
tags: [hooks, context]
plugins: ["../.."]

execution:
  prompt: |
    Three checks, in this order, exactly as written. After each one, report in one line
    what happened. If a call is refused, record the refusal and move on — do not work
    around it and do not retry it another way.

    1. Run `cat api/openapi.json` with Bash.
    2. Read `src/entities/article/model/types.ts` with the Read tool — the whole file, no offset, no limit.
    3. Run `cat src/entities/article/api/article.api.ts` with Bash.

    Then stop.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash]

context:
  scaffold_script: scaffold.sh
