schema_version: "1.1"
name: error-handling-conventions
description: >
  `/review` catches the `error-handling` slop planted on the feature branch: a catch that
  logs and continues, a try/catch inside a component body, and a fallback that silences a
  value the contract marks required.
tags: [review, error-handling]
plugins: ["../.."]

execution:
  prompt: |
    Review the changes on this branch for error-handling issues.
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Bash, Skill]

context:
  scaffold_script: scaffold.sh
