schema_version: "1.1"
name: routing-conventions
description: >
  `/review` catches the `routing` slop planted on the feature branch: a status filter kept
  in `useState` instead of the URL, a search-param update that drops other params, a loader
  that returns its own data instead of prefetching into the query cache, a hand-rolled
  navigation-pending flag duplicating the router's own, and a layout that blanks its whole
  subtree while a child route is loading.
tags: [review, routing]
plugins: ["../.."]

execution:
  prompt: |
    Review the changes on this branch for routing issues.
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Bash, Skill]

context:
  scaffold_script: scaffold.sh
