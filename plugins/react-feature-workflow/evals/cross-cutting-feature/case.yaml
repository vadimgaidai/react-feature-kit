schema_version: "1.1"
name: cross-cutting-feature
description: >
  Modeled on a real run of the workflow, a guided tour across a dashboard app:
  a feature that adds one folder-shaped context mirroring an existing one and edits five
  existing files — layout, page, navigation, settings, i18n — with a plan-approved library
  already installed. The sibling has five short files, not one long one; the long files are
  the library's type declarations and the translation catalogue. Asserts the shape of the
  work the real session did well and the two things it did wrong: reading the sibling file
  by file, and starting the dev server to "verify".
tags: [implement, context, real-shape]
plugins: ["../.."]
runs: 2

execution:
  prompt: |
    Use the `implement` skill to build the feature planned in `.planning/guided-tour/PLAN.md`.
    Everything you need is in that folder and in the repo. Work through it in one pass — do
    not ask me questions, decide and report what you decided.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill]

context:
  scaffold_script: scaffold.sh
