schema_version: "1.1"
name: plan-traceability
description: >
  `/plan` turns a finished SPEC.md into modules in build order, each citing the acceptance
  criteria it serves, with a Coverage table and a readiness check that names the one thing
  the spec needs and the contract has no source for — the author avatar. The raw OpenAPI
  file stays closed, no code is written, and the blocking question the spec already
  pre-decides is not asked.
tags: [plan, planning]
plugins: ["../.."]

execution:
  prompt: |
    /react-feature-workflow:plan the comments feature. The spec is at
    .planning/comments/SPEC.md and the contract slice at .planning/comments/contract.md.

    Answers to anything you would otherwise ask: no new dependency, build on what is
    installed; mirror `src/entities/article`; the list refetches after a successful post
    rather than updating optimistically.
  max_turns: 25
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Bash, Write, Skill]

context:
  scaffold_script: scaffold.sh
