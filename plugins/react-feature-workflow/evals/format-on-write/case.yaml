schema_version: "1.1"
name: format-on-write
description: >
  The PostToolUse formatting hook is wired: after Claude writes a source file, `prettier
  --write` runs on it. The fixture installs a stub `prettier` package that records what it
  was asked to format, so the case proves the hook fires without needing Prettier or the
  network. Without the plugin nothing runs after the write.
tags: [hooks, format]
plugins: ["../.."]

execution:
  prompt: |
    Create `src/hello.ts` exporting a function `hello(): string` that returns "hi".
    One file, no tests, no other changes. Then stop.
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Write]

context:
  scaffold_script: scaffold.sh
