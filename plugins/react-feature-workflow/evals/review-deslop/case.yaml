schema_version: "1.1"
name: review-deslop
description: >
  `/review` judges a module that is plausible line by line and wrong as a set of decisions:
  one planted instance of each of the six slop questions (a factory for one operation, a
  helper that repeats `shared/lib`, state synced from props, a hook that renames `.length`,
  a try/catch around a typed map, a fetch-in-effect beside the project's query layer), a
  removed export, and an index key. Every finding carries what / why not here / fix and
  a `file:line`; the review edits nothing, reads the sibling only in the ranges a
  comparison needs, and ends with a verdict.
tags: [review, slop]
plugins: ["../.."]

execution:
  prompt: |
    Review the changes on this branch: /review
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Skill]

context:
  scaffold_script: scaffold.sh
