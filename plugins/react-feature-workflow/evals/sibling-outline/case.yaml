schema_version: "1.1"
name: sibling-outline
description: >
  The tone reference is outlined, not read. A 400-line sibling module is named in the
  plan; `implement` must mirror its folder shape and key-factory convention from the
  outline rather than pulling the whole module into the window.
tags: [implement, context]
plugins: ["../.."]

execution:
  prompt: |
    Use the `implement` skill to build the feature planned in `.planning/comments/PLAN.md`.
    Everything you need is in that folder. Work through it in one pass — do not ask me
    questions.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill]

context:
  scaffold_script: scaffold.sh
