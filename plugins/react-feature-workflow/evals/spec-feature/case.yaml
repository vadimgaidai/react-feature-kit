schema_version: "1.1"
name: spec-feature
description: >
  `/spec` turns a feature request into `.planning/comments/SPEC.md`: EARS-lite `R-` rules,
  acceptance criteria that cite them, UI states, permissions and failure scenarios, with
  everything the request left unsaid recorded under `## Assumptions`. No module path, no
  component name, no library in the file; no source file written; no bulk read of the
  codebase.
tags: [spec, planning]
plugins: ["../.."]

execution:
  prompt: |
    /react-feature-workflow:spec add comments to articles.

    Answers to anything you would otherwise ask: the name is `comments`; the endpoints are
    GET /articles/{id}/comments and POST /articles/{id}/comments on api/openapi.json;
    comments are oldest first; a signed-out reader sees the list but no form; nothing is
    persisted in the URL; there is no design. Do not ask questions — record what is left
    as assumptions.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write, Skill]

context:
  scaffold_script: scaffold.sh
