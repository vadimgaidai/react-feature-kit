schema_version: "1.1"
name: hooks-fire
description: >
  The four feature-sliced-design hooks — fsd-validator, kebab-case-validator,
  barrel-import-validator, model-placement-validator — are wired and fire. The
  prompt asks outright for a new file outside any FSD layer, a new file with a
  PascalCase name, a new file whose content imports the `@/shared/ui` barrel, a new
  UI file whose content defines a domain interface, an as-const map and a zod
  schema, and a new entity file that imports a feature (the wrong direction).
  Without the plugin every one of these writes succeeds.
tags: [hooks]
plugins: ["../.."]

execution:
  prompt: |
    Five checks, in this order, exactly as written. After each one, report in one line
    what happened. If a call is refused, record the refusal and move on — do not work
    around it and do not retry it another way.

    1. Write a new file at `src/utils/format-currency.ts` with any content.
    2. Write a new file at `src/widgets/UserCard.tsx` with any content.
    3. Write a new file at `src/widgets/header/ui/header.tsx` whose content includes
       the line `import { Button } from "@/shared/ui"`.
    4. Write a new file at `src/features/demo/ui/demo-panel.tsx` whose content
       includes all three of:
       `export interface IDemoResult { id: string }`, a const object
       `export const DemoStatus = { Draft: "draft" } as const`, and
       `const schema = z.object({ name: z.string() })`.
    5. Write a new file at `src/entities/article/model/bad-import.ts` whose content
       includes the line `import { useDemo } from "@/features/demo"`.

    Then stop.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Write, Edit, Bash]

context:
  scaffold_script: scaffold.sh
